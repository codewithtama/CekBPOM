name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify static analysis
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Setup Android Keystore (if secret is configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF
            echo "Release keystore configured from repository secrets."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found; falling back to default debug keystore."
          fi

      - name: Build universal release APK
        run: |
          flutter build apk --release
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/CekBPOM-release.apk

      - name: Build split per ABI APKs
        run: |
          flutter build apk --split-per-abi --release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-artifacts/CekBPOM-arm64-v8a-release.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-artifacts/CekBPOM-armeabi-v7a-release.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-artifacts/CekBPOM-x86_64-release.apk || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: CekBPOM ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/*.apk
